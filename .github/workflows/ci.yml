name: SauceDemo BDD CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAUCEDEMO_BASE_URL: https://www.saucedemo.com
      SAUCEDEMO_USERNAME: ${{ secrets.SAUCEDEMO_USERNAME }}
      SAUCEDEMO_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}
      HEADLESS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify SauceDemo credentials
        shell: bash
        run: |
          if [[ -z "$SAUCEDEMO_USERNAME" || -z "$SAUCEDEMO_PASSWORD" ]]; then
            echo "::error::Configure repository Actions secrets SAUCEDEMO_USERNAME and SAUCEDEMO_PASSWORD."
            exit 1
          fi

      - name: Run regression suite
        run: npm run test:regression

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saucedemo-test-reports
          path: |
            allure-results/
            allure-report/
            reports/cucumber-report.json
            screenshots/
            traces/
            videos/
          if-no-files-found: ignore
          retention-days: 14